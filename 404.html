<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SketchRacer · Wrong turn</title>
<meta name="robots" content="noindex">
<style>
  :root{--ink:#06070b;--paper:#eef0f3;--mute:#828a98;--gold:#e8b84a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#121a2e,var(--ink) 65%);color:var(--paper);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;padding:24px;text-align:center}
  .c{max-width:440px}
  .n{font-size:96px;font-weight:800;font-style:italic;letter-spacing:-.04em;line-height:1;margin:0}
  h1{font-size:24px;margin:10px 0 6px}
  p{color:var(--mute);margin:0 0 22px}
  .road{height:6px;margin:22px auto;width:220px;background:repeating-linear-gradient(90deg,var(--paper) 0 22px,transparent 22px 40px);opacity:.5;border-radius:3px}
  nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  a{color:var(--ink);background:var(--paper);text-decoration:none;font-weight:700;padding:11px 16px;border-radius:999px;font-size:14px}
  a.alt{background:rgba(255,255,255,.1);color:var(--paper)}
  a.gold{background:var(--gold)}
</style>
</head>
<body>
  <div class="c">
    <p class="n">404</p>
    <div class="road"></div>
    <h1>Wrong turn.</h1>
    <p>This road doesn't go anywhere. Pick one that does:</p>
    <nav>
      <a href="/play">Free Drive</a>
      <a class="gold" href="/daily">Daily Track</a>
      <a class="alt" href="/daily/typer">Daily Typing Race</a>
      <a class="alt" href="/draw">Draw a Track</a>
      <a class="alt" href="/multiplayer">Multiplayer</a>
    </nav>
  </div>
</body>
</html>
